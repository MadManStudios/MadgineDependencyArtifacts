# This is a basic workflow to help you get started with Actions

name: python-emscripten

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    permissions:
      contents: write   

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install Toolchain
        uses: mymindstorm/setup-emsdk@v14

      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: 3.14
          path: cpython

      - name: Build Python
        run: |
          cd cpython
          python3 ./Platforms/emscripten build
          mkdir ../staging
          cp ./cross-build/wasm32-emscripten/build/python/python*.zip ../staging
          cp -r ./Include ../staging/Include
          cp ./LICENSE ../staging
          cp ./cross-build/wasm32-emscripten/build/python/pyconfig.h ../staging/Include

          cd ../staging
          emar -M < ../merge.mri
          
          zip -r ../python.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: python-emscripten
          tag_name: python-emscripten
          files: ${{ github.workspace }}/python.zip